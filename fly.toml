# fly.toml app configuration file generated for telegram-auto-forward-userbot on 2026-10-23T11:40:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'telegram-auto-forward-userbot'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[processes]
  app = 'python main.py'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
